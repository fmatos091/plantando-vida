<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Configurações básicas: codificação UTF-8 e responsividade -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Plantios — Plantando Vida</title>

    <!-- Leaflet.js CSS: estilos do mapa interativo -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- MarkerCluster CSS: estilos base dos clusters de marcadores -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- Tailwind CSS via CDN para navbar e overlay -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* html e body com height 100% para que o position:absolute do mapa
           calcule corretamente bottom:0 em todos os browsers/PCs */
        html, body { height: 100%; margin: 0; padding: 0; }

        /* O mapa ocupa toda a viewport abaixo da navbar */
        #mapa {
            position: absolute;
            top: 64px; /* altura da navbar */
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Tooltip customizado exibido ao passar o cursor sobre o marcador */
        .leaflet-tooltip-custom {
            background: white;
            border: 1px solid #16a34a;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            white-space: nowrap;
        }

        /* Popup com carrossel de fotos e dados do plantio */
        .popup-plantio h3 {
            font-size: 14px;
            font-weight: 700;
            color: #166534;
            margin-bottom: 4px;
        }

        .popup-plantio p {
            font-size: 12px;
            color: #4b5563;
            margin: 2px 0;
        }

        .popup-plantio a.gmaps-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #2563eb;
            text-decoration: underline;
        }

        /* Carrossel de fotos no popup — scroll horizontal */
        .carousel-fotos {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 8px;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: #16a34a #e5e7eb;
        }
        .carousel-fotos::-webkit-scrollbar { height: 4px; }
        .carousel-fotos::-webkit-scrollbar-track { background: #e5e7eb; border-radius: 4px; }
        .carousel-fotos::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 4px; }

        .carousel-fotos img {
            width: 90px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            border: 2px solid transparent;
        }
        .carousel-fotos img:hover {
            transform: scale(1.06);
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            border-color: #16a34a;
        }

        /* Foto única no popup */
        .foto-unica {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .foto-unica:hover { transform: scale(1.01); }

        /* Lightbox — overlay escuro com foto ampliada */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0,0,0,0.92);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #lightbox.ativo { display: flex; }
        #lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 4px 40px rgba(0,0,0,0.6);
        }
        #lightbox-fechar {
            position: absolute;
            top: 16px;
            right: 20px;
            color: white;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
            line-height: 1;
            opacity: 0.8;
        }
        #lightbox-fechar:hover { opacity: 1; }

        /* ---- Cluster de marcadores — tema verde ---- */
        /* Bolha circular exibida quando vários plantios estão próximos */
        .cluster-verde { background: transparent !important; border: none !important; }

        .cluster-inner {
            width: 46px;
            height: 46px;
            background: #16a34a;
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #dcfce7;
            box-shadow: 0 2px 10px rgba(22,163,74,0.45);
            transition: transform 0.15s;
        }
        /* Cluster maior quando tem muitos marcadores (>= 10) */
        .cluster-inner.grande {
            width: 54px;
            height: 54px;
            font-size: 17px;
            background: #15803d;
            border-color: #bbf7d0;
        }
        .cluster-verde:hover .cluster-inner { transform: scale(1.12); }
    </style>
</head>

<body class="bg-gray-100">

    <!-- ===================== NAVBAR ===================== -->
    <nav class="fixed top-0 left-0 right-0 z-[1000] bg-gray-800 text-white px-6 py-4
                flex justify-between items-center shadow-md" style="height:64px;">
        <div class="flex items-center gap-3">
            <!-- Voltar ao painel admin -->
            <a href="/admin/painel?tipo=plantios"
               class="text-gray-300 hover:text-white transition text-sm">
                ← Painel
            </a>
            <span class="text-gray-600">|</span>
            <span class="text-xl">🗺️</span>
            <span class="font-bold">Mapa de Plantios</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- Contador total de marcadores -->
            <span class="bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-full">
                🌳 {{ total }} plantio{{ 's' if total != 1 else '' }} aprovado{{ 's' if total != 1 else '' }}
            </span>
            <!-- Botão home -->
            <a href="/" class="text-gray-400 hover:text-white text-sm transition">🏠 Início</a>
        </div>
    </nav>

    <!-- ===================== CONTAINER DO MAPA =====================
         O div #mapa é inicializado pelo Leaflet.js no script abaixo.
         Ocupa toda a área abaixo da navbar (top: 64px).
    -->
    <div id="mapa"></div>

    <!-- Mensagem exibida quando não há plantios com coordenadas -->
    {% if total == 0 %}
    <div class="fixed inset-0 flex items-center justify-center z-[999] bg-green-50"
         style="top:64px;">
        <div class="text-center p-10">
            <div class="text-6xl mb-4">🌿</div>
            <h2 class="text-xl font-bold text-green-800 mb-2">Nenhum plantio no mapa</h2>
            <p class="text-gray-500 text-sm">
                Não há plantios aprovados com coordenadas GPS cadastradas.
            </p>
            <a href="/admin/painel?tipo=plantios"
               class="inline-block mt-6 bg-green-600 hover:bg-green-700 text-white
                      font-semibold px-6 py-2 rounded-xl transition text-sm">
                ← Voltar ao Painel
            </a>
        </div>
    </div>
    {% endif %}


    <!-- Lightbox — overlay para foto ampliada (clique fora ou × fecha) -->
    <div id="lightbox" onclick="fecharLightbox()">
        <button id="lightbox-fechar" onclick="fecharLightbox()">✕</button>
        <img id="lightbox-img" src="" alt="Foto ampliada" onclick="event.stopPropagation()">
    </div>

    <!-- ===================== LEAFLET.JS + MARKERCLUSTER ===================== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MarkerCluster JS: agrupa marcadores próximos ao dar zoom out -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // Dados dos marcadores injetados pelo Flask como JSON seguro
        const marcadores = {{ marcadores_json | safe }};

        // Mapa de fotos por plantio — chave: plantio.id, valor: array de URLs
        const fotosMap = {};
        marcadores.forEach(function(m) {
            if (m.fotos && m.fotos.length > 0) fotosMap[m.id] = m.fotos;
        });

        // ---- Lightbox ----
        function abrirFoto(plantioId, idx) {
            const fotos = fotosMap[plantioId];
            if (!fotos || !fotos[idx]) return;
            document.getElementById('lightbox-img').src = fotos[idx];
            document.getElementById('lightbox').classList.add('ativo');
        }

        function fecharLightbox() {
            document.getElementById('lightbox').classList.remove('ativo');
            document.getElementById('lightbox-img').src = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharLightbox();
        });

        // ---- Mapa ----
        const mapa = L.map('mapa');

        // CartoDB Voyager: CDN global, sem rate limit para uso normal em produção.
        // Substitui tile.openstreetmap.org que bloqueia/limita IPs de domínios em produção.
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(mapa);

        // Garante que o mapa recalcule as dimensões do container após o DOM estabilizar
        setTimeout(function() { mapa.invalidateSize(); }, 200);

        const iconeVerde = L.divIcon({
            className: '',
            html: '<div style="font-size:28px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3))">🌳</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -34]
        });

        // MarkerClusterGroup: agrupa marcadores próximos no zoom out,
        // revela individualmente conforme o usuário aproxima o mapa.
        const grupo = L.markerClusterGroup({
            maxClusterRadius: 60,        // distância (px) para agrupar marcadores
            spiderfyOnMaxZoom: true,     // no zoom máximo, abre em leque para ver todos
            showCoverageOnHover: false,  // não exibe polígono de cobertura do cluster
            zoomToBoundsOnClick: true,   // clique no cluster dá zoom para seus marcadores
            // Ícone personalizado no tema verde do projeto
            iconCreateFunction: function(cluster) {
                const count = cluster.getChildCount();
                const cls   = count >= 10 ? 'cluster-inner grande' : 'cluster-inner';
                return L.divIcon({
                    className:  'cluster-verde',
                    html:       '<div class="' + cls + '">🌳 ' + count + '</div>',
                    iconSize:   [54, 54],
                    iconAnchor: [27, 27]
                });
            }
        });

        marcadores.forEach(function(m) {
            const tooltipHtml =
                '<strong style="color:#166534;">' + (m.especie || '—') + '</strong><br>' +
                '👤 ' + (m.nome || '—') + '<br>' +
                '📅 ' + (m.data || '—') + '<br>' +
                '📍 ' + (m.bairro || '—') + ', ' + (m.municipio || '—');

            // Monta HTML do carrossel de fotos
            let fotosHtml = '';
            if (m.fotos && m.fotos.length === 1) {
                fotosHtml =
                    '<img class="foto-unica" src="' + m.fotos[0] + '" ' +
                    'onclick="abrirFoto(' + m.id + ',0)" ' +
                    'onerror="this.style.display=\'none\'" alt="Foto">';
            } else if (m.fotos && m.fotos.length > 1) {
                fotosHtml = '<div class="carousel-fotos">';
                m.fotos.forEach(function(foto, idx) {
                    fotosHtml +=
                        '<img src="' + foto + '" ' +
                        'onclick="abrirFoto(' + m.id + ',' + idx + ')" ' +
                        'onerror="this.parentNode.removeChild(this)" alt="Foto ' + (idx + 1) + '">';
                });
                fotosHtml += '</div>';
            }

            const gmapsUrl = 'https://www.google.com/maps?q=' + m.lat + ',' + m.lng;

            const popupHtml =
                '<div class="popup-plantio" style="min-width:210px;max-width:270px;">' +
                fotosHtml +
                '<h3>🌳 ' + (m.especie || '—') + '</h3>' +
                '<p>👤 <strong>' + (m.nome || '—') + '</strong></p>' +
                '<p>📅 ' + (m.data || '—') + '</p>' +
                '<p>📍 ' + (m.bairro || '—') + ', ' + (m.municipio || '—') + '</p>' +
                (m.fotos && m.fotos.length > 0
                    ? '<p style="font-size:11px;color:#6b7280;margin-top:4px;">📸 ' + m.fotos.length + ' foto' + (m.fotos.length > 1 ? 's' : '') + ' — clique para ampliar</p>'
                    : '') +
                '<a href="' + gmapsUrl + '" target="_blank" class="gmaps-link">🗺️ Ver no Google Maps</a>' +
                '</div>';

            const marker = L.marker([m.lat, m.lng], { icon: iconeVerde })
                .bindTooltip(tooltipHtml, {
                    className: 'leaflet-tooltip-custom',
                    direction: 'top',
                    offset: [0, -30]
                })
                .bindPopup(popupHtml, { maxWidth: 290 });

            grupo.addLayer(marker);
        });

        grupo.addTo(mapa);

        // Ajusta o zoom inicial para enquadrar todos os marcadores.
        // Usa as coordenadas brutas em vez de grupo.getBounds() para evitar
        // timing issue do MarkerCluster antes de terminar o processamento interno.
        if (marcadores.length > 0) {
            const bounds = L.latLngBounds(marcadores.map(function(m) { return [m.lat, m.lng]; }));
            mapa.fitBounds(bounds, { padding: [50, 50] });
        } else {
            mapa.setView([-15.78, -47.93], 5);
        }
    </script>

</body>
</html>
