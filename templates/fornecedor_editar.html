<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Configurações básicas: codificação UTF-8, responsividade e título da aba -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Fornecedor - Plantando Vida</title>
    <!-- Tailwind CSS via CDN para estilização da página -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 min-h-screen flex items-center justify-center py-10">

    <!-- ===================== CARD DE EDIÇÃO =====================
         Exibe o formulário preenchido com os dados atuais do fornecedor.
         Os dados vêm do backend via variável Jinja2 "fornecedor":
         fornecedor = (id, razao_social, cnpj, whatsapp, tipo_planta, maps_link)
    -->
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">

        <!-- Título do card -->
        <h2 class="text-center text-2xl font-bold text-green-700 mb-6">
            ✏️ Editar Fornecedor
        </h2>

        <!-- ===================== FORMULÁRIO DE EDIÇÃO =====================
             method="POST" envia os dados atualizados de forma segura.
             action aponta para /fornecedor/<id>/editar com o id do fornecedor.
             O backend atualiza o registro no banco e redireciona para a lista.
        -->
        <form method="POST" action="/fornecedor/{{ fornecedor[0] }}/editar" class="space-y-4">

            <!-- Campo Razão Social: preenchido com o valor atual -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Razão Social</label>
                <input name="razao_social" required value="{{ fornecedor[1] }}"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" />
            </div>

            <!-- Campo CNPJ: preenchido com o valor atual -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ</label>
                <input name="cnpj" required value="{{ fornecedor[2] }}"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" />
            </div>

            <!-- Campo WhatsApp: preenchido com o valor atual -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">WhatsApp</label>
                <input name="whatsapp" required value="{{ fornecedor[3] }}"
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" />
            </div>

            <!-- Campo Tipo de Planta: checkboxes pré-marcados conforme o valor salvo.
                 O Jinja2 verifica se o valor atual contém "Frutíferas" ou "Nativas"
                 para pré-selecionar os checkboxes corretamente. -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Tipo de Planta</label>
                <div class="flex gap-6">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <!-- checked se o tipo atual for Frutíferas ou Ambas -->
                        <input type="checkbox" id="chk-frutiferas" class="w-4 h-4 accent-green-600"
                            {{ 'checked' if 'Frutíferas' in fornecedor[4] or fornecedor[4] == 'Ambas' }} />
                        <span class="text-sm text-gray-700">🍎 Frutíferas</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <!-- checked se o tipo atual for Nativas ou Ambas -->
                        <input type="checkbox" id="chk-nativas" class="w-4 h-4 accent-green-600"
                            {{ 'checked' if 'Nativas' in fornecedor[4] or fornecedor[4] == 'Ambas' }} />
                        <span class="text-sm text-gray-700">🌳 Nativas</span>
                    </label>
                </div>
                <!-- Campo oculto que recebe o valor combinado dos checkboxes via JS -->
                <input type="hidden" id="tipo_planta" name="tipo_planta" value="{{ fornecedor[4] }}" />
                <p id="erro-tipo" class="text-red-500 text-xs mt-1 hidden">Selecione ao menos um tipo.</p>
            </div>

            <!-- Campo Link do Maps: preenchido com o valor atual -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Link do Google Maps</label>
                <input name="maps_link" value="{{ fornecedor[5] or '' }}"
                    placeholder="https://maps.google.com/..."
                    class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400" />
            </div>

            <!-- Botão salvar: valida checkboxes antes de enviar -->
            <button type="submit" onclick="return prepararEnvio()"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">
                💾 Salvar alterações
            </button>

        </form>
        <!-- fim do formulário -->

        <!-- Links de navegação -->
        <div class="flex justify-between mt-4 text-sm text-gray-400">
            <a href="/fornecedores" class="hover:text-green-600 hover:underline transition">← Voltar à lista</a>
            <a href="/" class="hover:text-green-600 hover:underline transition">🏠 Início</a>
        </div>

    </div>

    <!-- ===================== JAVASCRIPT =====================
         Lê os checkboxes, monta o valor combinado no campo oculto
         e valida que ao menos um tipo foi selecionado antes de enviar.
    -->
    <script>
        function prepararEnvio() {
            const frutifera = document.getElementById('chk-frutiferas').checked;
            const nativa    = document.getElementById('chk-nativas').checked;
            const erro      = document.getElementById('erro-tipo');

            if (!frutifera && !nativa) {
                erro.classList.remove('hidden');
                return false;
            }

            erro.classList.add('hidden');

            // Define o valor do campo oculto conforme seleção
            if (frutifera && nativa)   document.getElementById('tipo_planta').value = 'Ambas';
            else if (frutifera)        document.getElementById('tipo_planta').value = 'Frutíferas';
            else                       document.getElementById('tipo_planta').value = 'Nativas';

            return true;
        }
    </script>

</body>
</html>
